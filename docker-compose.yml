services:
  backend:
    build: ./server
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env
    dns:
    - 8.8.8.8
    - 8.8.4.4
    depends_on:
      - db

  frontend:
    build: ./codebase-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: leetcode_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass123
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
